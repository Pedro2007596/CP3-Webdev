<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP3</title>
</head>
<body>
    <h1>CP3 - Webdev - Filro de produtos</h1>
    <select name="" id="categorias">
        <option value="">Selecione o produto</option>
        <option value="Vestuário">Vestuário</option>
        <option value="Eletrônicos">Eletrônicos</option>
        <option value="Livros">Livros</option>
        <option value="Móveis">Móveis</option>
        <option value="Acessórios">Acessórios</option>
    </select>
    <label>
        <input type="checkbox" name="" id="disponiveis">
        <span>Produtos disponíveis</span>
    </label>
    <label>
        <input type="checkbox" name="" id="naodisponiveis">
        <span>Produtos não disponíveis</span>
    </label>
    <button id="btnfiltrar">Filtrar produtos</button>
    <h2>Produtos</h2>
    <div id="produtos">
    </div>
</body>
    <script src="app.js"></script>
</html>
